[project]
name = "agentic-command-center"
version = "0.1.0"
description = "Personal Agentic Command Center — a self-hosted AI agent with an iPhone app and desktop dashboard over a git-backed data plane."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=0.0.1",
    "python-telegram-bot>=21.0",
    "duckdb>=1.0",
    "apscheduler>=3.10",
    "logfire>=0.50",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.49.0",
    "webauthn>=3.0.0",
    "pywebpush>=2.3.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
