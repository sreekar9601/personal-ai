# Fly.io deployment for the personal-ai service.
# `fly launch --no-deploy` to create the app, set secrets, then `fly deploy`.
#
#   fly secrets set TELEGRAM_BOT_TOKEN=... ANTHROPIC_API_KEY=... \
#       TELEGRAM_ALLOWED_USER_IDS=123456789
#
# The volume holds the git repo (vault + sqlite). The Telegram bot long-polls
# outward; the PWA (Phase 10) is served on the public HTTPS port, gated by
# passkey auth (api/auth.py). Set PWA_ORIGIN to this app's public URL.

app = "personal-ai"
primary_region = "iad"

[build]
  # Uses the Dockerfile in this directory (see Dockerfile).

[env]
  # Non-secret defaults; secrets come from `fly secrets`.
  # Knowledge repo + sqlite live on the volume (see agent/bootstrap.py).
  PERSONAL_AI_DATA = "/data"
  KILL_SWITCH = "false"
  MAX_TURNS = "12"
  GIT_PUSH = "true"
  PWA_ORIGIN = "https://personal-ai.fly.dev"  # <- your app's public URL

[mounts]
  source = "personal_ai_data"
  destination = "/data"

# The PWA. The Telegram poller must never be stopped for idleness, so
# auto_stop stays off and one machine always runs.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
