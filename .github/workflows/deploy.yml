# CI on every PR; auto-deploy to Fly on every merge to main (PLAN.md §9.2).
#
# Deploy needs a FLY_API_TOKEN repo secret (`fly tokens create deploy`). If the
# secret is absent the deploy step skips cleanly, so CI stays green for forks
# and for anyone running the bot somewhere other than Fly.
name: CI & Deploy

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: fly-deploy   # never two deploys at once
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN secret not set — skipping deploy."
            exit 0
          fi
          flyctl deploy --remote-only
